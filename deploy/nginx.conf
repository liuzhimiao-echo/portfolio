# Nginx 反向代理模板（可选，用于「域名 + HTTPS」专业部署）
# 适用：已把域名解析到服务器、希望访问 http(s)://你的域名 而非 :3000
#
# 安装：sudo apt-get install -y nginx
# 用法：把下面 server 块内容写入 /etc/nginx/sites-available/portfolio，
#       再 sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#       然后 sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo apt-get install -y certbot python3-certbot-nginx && sudo certbot --nginx -d 你的域名

server {
    listen 80;
    server_name 你的域名.com www.你的域名.com;

    # 上传大文件（如视频/图片）时按需调大
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（私密收件箱实时推送）需要关闭缓冲
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
